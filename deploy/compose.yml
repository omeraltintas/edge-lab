name: edge-lab

# Uc replica ayni tanimi paylasiyor. `deploy.replicas` yerine acik servisler
# kullaniyoruz: HAProxy'nin `server` satirlari sabit DNS adi ister, Docker'in
# dondurdugu tek isim + coklu A kaydi ile ugrasmak Faz 1 icin gereksiz risk.
x-app: &app
  build:
    context: ../app
  image: edge-lab-app:local
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edge}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil}@postgres:5432/${POSTGRES_DB:-edge}
    BASE_URL: ${BASE_URL:-http://192.168.56.10:18080}
  expose:
    - "8000"
  depends_on:
    postgres:
      condition: service_healthy
  cpus: 0.5
  stop_grace_period: 30s
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil}
      POSTGRES_DB: ${POSTGRES_DB:-edge}
    ports:
      # 0.0.0.0: migration'i Windows'tan calistirabilmek icin (host-only ag)
      - "${DB_BIND:-0.0.0.0}:${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edge} -d ${POSTGRES_DB:-edge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app-1:
    <<: *app
  app-2:
    <<: *app
  app-3:
    <<: *app

  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Trafik artik Kong'dan geliyor. Bu port sadece teshis icin:
      # "sorun gateway'de mi, arkasinda mi" sorusunu iki curl ile ayirir.
      - "${LB_DEBUG_PORT:-18090}:80"
      - "${LB_STATS_PORT:-18404}:8404"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
    cpus: 0.5
    restart: unless-stopped

  kong:
    image: kong:3.9
    environment:
      # DB-less mod: konfigurasyon kong.yml'den okunur, Kong'un kendi
      # veritabani yok. Tek VM'de ikinci bir Postgres gereksiz yuk olurdu.
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: notice
      # Yuk testinde istek basina log yazmak olcumu kirletir.
      KONG_PROXY_ACCESS_LOG: /dev/null
      KONG_ADMIN_ACCESS_LOG: /dev/null
      # 4 vCPU'da tek nginx worker yeter; fazlasi app'ten CPU calar.
      KONG_NGINX_WORKER_PROCESSES: "1"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT:-18080}:8000"
      - "${KONG_ADMIN_PORT:-18081}:8001"
    depends_on:
      # Kong, HAProxy'nin saglikli olmasini beklemez: HAProxy bir healthcheck
      # yayinlamiyor ve Kong zaten 502 dondurur. Erken baslamasi zararsiz.
      haproxy:
        condition: service_started
    cpus: 0.5
    restart: unless-stopped

volumes:
  pgdata:
