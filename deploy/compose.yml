name: edge-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil}
      POSTGRES_DB: ${POSTGRES_DB:-edge}
    ports:
      # 0.0.0.0: migration'i Windows'tan calistirabilmek icin (host-only ag)
      - "${DB_BIND:-0.0.0.0}:${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edge} -d ${POSTGRES_DB:-edge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ../app
    environment:
      # container aginda servis adi: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edge}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil}@postgres:5432/${POSTGRES_DB:-edge}
      BASE_URL: ${BASE_URL:-http://192.168.56.10:18000}
    ports:
      - "${APP_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
