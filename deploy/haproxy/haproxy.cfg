# Faz 1: uc app replicasinin onunde tek giris noktasi.
# Tek soru: ayni isi 3 kopyaya bolmek throughput'u artiriyor mu?
#
# Kasitli olarak yapilmayanlar (Faz 5'e):
#   - drain / graceful shutdown koordinasyonu
#   - instance kill testi
#   - algoritma karsilastirmasi (leastconn / roundrobin / random)

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    # Yuk testinde her istegi loglamak olcumu kirletir; sadece hatalar kalsin.
    option  dontlog-normal
    option  forwardfor
    option  redispatch
    retries 2
    timeout connect 1s
    timeout client  30s
    timeout server  30s
    # Kuyruk sinirsiz buyumesin: 5 sn bekleyen istek 503 alir.
    timeout queue   5s
    default-server inter 2s fall 3 rise 2

frontend http_in
    bind *:80
    default_backend app

backend app
    balance leastconn
    # DB'ye bakan bir endpoint DEGIL: DB yavaslayinca 3 replica birden
    # havuzdan dusmesin.
    option httpchk GET /healthz
    http-check expect status 200
    server app-1 app-1:8000 check
    server app-2 app-2:8000 check
    server app-3 app-3:8000 check

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
